basePath: /
definitions:
  dto.BookResponse:
    properties:
      author:
        type: string
      available_stock:
        type: integer
      genres:
        items:
          type: string
        type: array
      id:
        type: integer
      isbn:
        type: string
      rental_id:
        type: integer
      status:
        type: string
      title:
        type: string
    type: object
  dto.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  dto.RegisterRequest:
    properties:
      email:
        type: string
      name:
        type: string
      password:
        type: string
    type: object
  dto.RentalRequest:
    properties:
      book_id:
        type: integer
      days:
        minimum: 1
        type: integer
    required:
    - book_id
    - days
    type: object
  dto.RentalResponse:
    properties:
      amount:
        type: integer
      external_id:
        type: string
      message:
        type: string
      paid_via:
        description: '"WALLET" or "XENDIT"'
        type: string
      payment_url:
        type: string
    type: object
  dto.TopUpRequest:
    properties:
      amount:
        minimum: 10000
        type: integer
    required:
    - amount
    type: object
  dto.UserResponse:
    properties:
      email:
        type: string
      name:
        type: string
    type: object
  dto.XenditCallbackRequest:
    properties:
      external_id:
        type: string
      status:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: A robust backend for a physical book rental system.
  title: Rent and Read API
  version: "1.0"
paths:
  /api/books:
    get:
      description: Get a list of all available books
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.BookResponse'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List all books
      tags:
      - Books
  /api/rentals:
    post:
      consumes:
      - application/json
      description: Create a new rental transaction using Wallet or Xendit
      parameters:
      - description: Rental Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.RentalRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.RentalResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Rent a book
      tags:
      - Rentals
  /api/rentals/{id}/return:
    post:
      consumes:
      - application/json
      description: Return a book and update stock
      parameters:
      - description: Rental ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Return a rented book
      tags:
      - Rentals
  /api/users/books:
    get:
      description: Get a list of books currently rented by the authenticated user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.BookResponse'
            type: array
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List rented books
      tags:
      - Books
  /api/users/books/active:
    get:
      description: Get a list of books currently actively rented by the authenticated
        user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.BookResponse'
            type: array
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List active rented books
      tags:
      - Books
  /api/users/login:
    post:
      consumes:
      - application/json
      description: Authenticate user and return JWT token
      parameters:
      - description: Login Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Login user
      tags:
      - Users
  /api/users/register:
    post:
      consumes:
      - application/json
      description: Create a new user account with email and password
      parameters:
      - description: Register Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.UserResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Register a new user
      tags:
      - Users
  /api/wallet/balance:
    get:
      description: Get the current balance of the authenticated user's wallet
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get user balance
      tags:
      - Wallet
  /api/wallet/topup:
    post:
      consumes:
      - application/json
      description: Request a top-up for the user's wallet
      parameters:
      - description: TopUp Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.TopUpRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Top up wallet balance
      tags:
      - Wallet
  /webhooks/xendit:
    post:
      consumes:
      - application/json
      description: Webhook endpoint for Xendit payment status updates
      parameters:
      - description: Callback Payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.XenditCallbackRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Handle Xendit Payment Callback
      tags:
      - Webhooks
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
